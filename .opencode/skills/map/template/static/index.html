<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Architecture Cartography</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel-bg: rgba(18, 24, 38, 0.88);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f8;
      --text-muted: #8a99ad;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-purple: #c084fc;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --card-bg: #151d2c;
      --card-border: #233047;
      --grid-line: rgba(255, 255, 255, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Spatial Canvas Background */
    #viewport {
      position: absolute;
      inset: 0;
      cursor: grab;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.04) 0%, transparent 60%),
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
    }

    #viewport.dragging {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* Top Navigation HUD */
    .hud-header {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }

    .brand-group {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .system-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fff;
    }

    /* Breadcrumbs navigation */
    .breadcrumbs {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .crumb-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .crumb-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.06);
    }

    .crumb-btn.active {
      color: var(--accent);
      font-weight: 600;
      background: rgba(56, 189, 248, 0.1);
    }

    .crumb-separator {
      color: rgba(255, 255, 255, 0.2);
    }

    /* Controls HUD */
    .hud-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
      z-index: 50;
    }

    .ctrl-btn {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    /* SVG Canvas Elements */
    svg.canvas-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 3600px;
      height: 2400px;
      overflow: visible;
      pointer-events: none;
    }

    /* Connectors */
    .connector-path {
      stroke: #2a374f;
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.2s ease, stroke-width 0.2s ease;
      pointer-events: stroke;
      cursor: pointer;
    }

    .connector-flow {
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-dasharray: 8 16;
      fill: none;
      animation: dashflow 1.4s linear infinite;
      pointer-events: none;
    }

    .connector-hitbox {
      stroke: transparent;
      stroke-width: 28;
      fill: none;
      pointer-events: stroke;
      cursor: pointer;
    }

    .connector-hitbox:hover ~ .connector-path,
    .connector-path.active {
      stroke: var(--accent);
      stroke-width: 6;
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    @keyframes dashflow {
      to {
        stroke-dashoffset: -24;
      }
    }

    /* Connector Pill Badges on lines */
    .connector-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #141c2b;
      border: 1px solid #2d3c56;
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
      z-index: 10;
    }

    .connector-badge:hover,
    .connector-badge.active {
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow), 0 8px 24px rgba(0,0,0,0.6);
    }

    .protocol-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    /* Drag Handle Gripper Bar */
    .drag-handle {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      cursor: move;
      transition: background 0.15s;
    }

    .system-node:hover .drag-handle,
    .subsystem-node:hover .drag-handle {
      background: var(--accent);
    }

    /* System Blocks */
    .system-node {
      position: absolute;
      width: 270px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px 20px 18px 20px;
      cursor: move;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s, box-shadow 0.2s;
      z-index: 5;
    }

    .system-node:hover {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 24px var(--accent-glow);
    }

    .system-node.dragging {
      z-index: 25;
      border-color: var(--accent);
      box-shadow: 0 24px 48px rgba(0,0,0,0.8), 0 0 28px var(--accent-glow);
      cursor: grabbing !important;
    }

    .node-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .node-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .node-title-group h3 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      line-height: 1.2;
    }

    .node-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    .node-body {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-muted);
      margin-bottom: 14px;
      pointer-events: none;
    }

    .node-metrics {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11.5px;
      pointer-events: none;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      color: #7e8d9f;
    }

    .metric-val {
      color: #d1d5db;
      font-weight: 500;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .drilldown-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 14px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .drilldown-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #fff;
    }

    /* Subsystem Nodes (LOD 1) */
    .subsystem-node {
      position: absolute;
      width: 230px;
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 20px 16px 16px 16px;
      cursor: move;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s, box-shadow 0.2s;
      z-index: 5;
    }

    .subsystem-node:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 18px rgba(192, 132, 252, 0.25);
    }

    .subsystem-node.dragging {
      z-index: 25;
      border-color: var(--accent-purple);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 24px rgba(192, 132, 252, 0.4);
      cursor: grabbing !important;
    }

    .subsystem-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      pointer-events: none;
    }

    .subsystem-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-purple);
      margin-bottom: 8px;
      pointer-events: none;
    }

    .subsystem-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
      pointer-events: none;
    }

    /* Side Detail Drawer (Inspection Panel) */
    #inspector {
      position: absolute;
      top: 24px;
      right: 24px;
      bottom: 24px;
      width: 420px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: -10px 0 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      z-index: 60;
      transform: translateX(460px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    #inspector.open {
      transform: translateX(0);
    }

    .inspector-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .inspector-close-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.15s;
    }

    .inspector-close-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.12);
    }

    .inspector-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 10px;
      margin-top: 20px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .endpoint-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .endpoint-method {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .method-POST { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .method-GET { background: rgba(52, 211, 153, 0.15); color: #34d399; }
    .method-SQL { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .method-MIGRATE { background: rgba(192, 132, 252, 0.15); color: #c084fc; }

    .endpoint-path {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      margin-left: 6px;
    }

    .endpoint-desc {
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .endpoint-contract {
      background: #090d14;
      border: 1px solid #1a2333;
      border-radius: 6px;
      padding: 6px 10px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      color: #38bdf8;
      margin-top: 8px;
      word-break: break-all;
    }

    .code-pill {
      font-family: ui-monospace, SFMono-Regular, monospace;
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #e2e8f0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      row-gap: 8px;
      font-size: 12.5px;
    }

    .info-label {
      color: #64748b;
      font-weight: 500;
    }

    .info-val {
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Top Floating Header & Breadcrumbs HUD -->
  <header class="hud-header">
    <div class="brand-group">
      <span class="brand-badge">Map Active</span>
      <span class="system-title" id="project-title">Core Platform Architecture</span>
    </div>

    <nav class="breadcrumbs" id="breadcrumbs">
      <button class="crumb-btn active" onclick="app.navToOverworld()">Global Overworld</button>
    </nav>
  </header>

  <!-- Navigation Viewport -->
  <main id="viewport">
    <div id="world">
      <!-- Connectors SVG Layer -->
      <svg class="canvas-svg" id="canvas-svg"></svg>
      <!-- Interactive HTML Node Containers -->
      <div id="nodes-container"></div>
      <div id="connector-badges-container"></div>
    </div>
  </main>

  <!-- Side Inspector Drawer -->
  <aside id="inspector" aria-label="Inspection Panel">
    <div class="inspector-header">
      <div>
        <div id="inspector-badge" class="brand-badge" style="margin-bottom: 6px;">Detail View</div>
        <h2 id="inspector-title" style="font-size: 18px; color: #fff;">Inspector</h2>
      </div>
      <button class="inspector-close-btn" onclick="app.closeInspector()">&times;</button>
    </div>
    <div class="inspector-content" id="inspector-content">
      <!-- Dynamic content injected here -->
    </div>
  </aside>

  <!-- Bottom-Right Controls HUD -->
  <footer class="hud-controls">
    <button class="ctrl-btn" onclick="app.zoomIn()" title="Zoom In">+</button>
    <button class="ctrl-btn" onclick="app.zoomOut()" title="Zoom Out">&minus;</button>
    <button class="ctrl-btn" onclick="app.resetView()" title="Center Map">&#x2316;</button>
  </footer>

  <script>
    class ArchMapApp {
      constructor() {
        this.manifest = null;
        this.currentLevel = "overworld"; // "overworld" | "system"
        this.activeSystemId = null;

        // Camera State
        this.camX = 100;
        this.camY = 100;
        this.scale = 1.0;
        this.isPanning = false;
        this.panStartX = 0;
        this.panStartY = 0;

        // Node Dragging State
        this.draggedNode = null;
        this.dragStartNodePos = { x: 0, y: 0 };
        this.dragStartPointer = { x: 0, y: 0 };
        this.hasMovedSignificantly = false;

        // Elements
        this.viewport = document.getElementById("viewport");
        this.world = document.getElementById("world");
        this.svg = document.getElementById("canvas-svg");
        this.nodesContainer = document.getElementById("nodes-container");
        this.badgesContainer = document.getElementById("connector-badges-container");
        this.inspector = document.getElementById("inspector");
        this.breadcrumbs = document.getElementById("breadcrumbs");

        this.initEvents();
      }

      async load() {
        try {
          const res = await fetch("architecture.json");
          this.manifest = await res.json();
          document.getElementById("project-title").innerText = this.manifest.title || "Architecture Map";
          this.render();
          this.centerOverview();
        } catch (err) {
          console.error("Failed to load architecture.json:", err);
        }
      }

      initEvents() {
        // Pointer down: disambiguate viewport pan vs node drag
        this.viewport.addEventListener("mousedown", (e) => {
          if (e.target.closest("#inspector, .hud-header, .hud-controls, .connector-badge, .drilldown-btn")) {
            return;
          }

          const nodeEl = e.target.closest(".system-node, .subsystem-node");
          if (nodeEl) {
            // Dragging a component node
            this.draggedNode = {
              id: nodeEl.dataset.id,
              type: nodeEl.dataset.type, // 'system' | 'subsystem'
              el: nodeEl
            };

            const dataObj = this.findNodeData(this.draggedNode.id, this.draggedNode.type);
            this.dragStartNodePos = { ...dataObj.position };
            this.dragStartPointer = { x: e.clientX, y: e.clientY };
            this.hasMovedSignificantly = false;
            nodeEl.classList.add("dragging");
            e.stopPropagation();
          } else {
            // Panning the canvas
            this.isPanning = true;
            this.panStartX = e.clientX - this.camX;
            this.panStartY = e.clientY - this.camY;
            this.viewport.classList.add("dragging");
          }
        });

        window.addEventListener("mousemove", (e) => {
          if (this.draggedNode) {
            const dx = (e.clientX - this.dragStartPointer.x) / this.scale;
            const dy = (e.clientY - this.dragStartPointer.y) / this.scale;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
              this.hasMovedSignificantly = true;
            }

            const dataObj = this.findNodeData(this.draggedNode.id, this.draggedNode.type);
            dataObj.position.x = Math.round(this.dragStartNodePos.x + dx);
            dataObj.position.y = Math.round(this.dragStartNodePos.y + dy);

            // Update DOM element position instantly
            this.draggedNode.el.style.left = `${dataObj.position.x}px`;
            this.draggedNode.el.style.top = `${dataObj.position.y}px`;

            // Live-update connector lines and badges
            this.updateConnectorsOnly();
            return;
          }

          if (this.isPanning) {
            this.camX = e.clientX - this.panStartX;
            this.camY = e.clientY - this.panStartY;
            this.updateTransform();
          }
        });

        window.addEventListener("mouseup", () => {
          if (this.draggedNode) {
            this.draggedNode.el.classList.remove("dragging");
            this.draggedNode = null;
          }
          if (this.isPanning) {
            this.isPanning = false;
            this.viewport.classList.remove("dragging");
          }
        });

        // Wheel Zoom
        this.viewport.addEventListener("wheel", (e) => {
          e.preventDefault();
          const zoomFactor = 1.08;
          const oldScale = this.scale;
          let newScale = e.deltaY < 0 ? oldScale * zoomFactor : oldScale / zoomFactor;
          newScale = Math.min(Math.max(0.3, newScale), 2.5);

          const rect = this.viewport.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;

          this.camX = mouseX - (mouseX - this.camX) * (newScale / oldScale);
          this.camY = mouseY - (mouseY - this.camY) * (newScale / oldScale);
          this.scale = newScale;
          this.updateTransform();
        }, { passive: false });
      }

      findNodeData(id, type) {
        if (type === "system") {
          return this.manifest.root.systems.find(s => s.id === id);
        } else {
          const sys = this.manifest.root.systems.find(s => s.id === this.activeSystemId);
          return sys?.internal?.nodes?.find(n => n.id === id);
        }
      }

      updateTransform() {
        this.world.style.transform = `translate(${this.camX}px, ${this.camY}px) scale(${this.scale})`;
      }

      zoomIn() {
        this.scale = Math.min(2.5, this.scale * 1.25);
        this.updateTransform();
      }

      zoomOut() {
        this.scale = Math.max(0.3, this.scale / 1.25);
        this.updateTransform();
      }

      resetView() {
        if (this.currentLevel === "overworld") {
          this.centerOverview();
        } else if (this.activeSystemId) {
          this.centerSubsystems();
        }
      }

      centerOverview() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        this.scale = Math.min(1.0, vw / 1400);
        this.camX = (vw - 1200 * this.scale) / 2;
        this.camY = (vh - 600 * this.scale) / 2;
        this.updateTransform();
      }

      centerSubsystems() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        this.scale = 1.0;
        this.camX = (vw - 800) / 2;
        this.camY = (vh - 500) / 2;
        this.updateTransform();
      }

      render() {
        this.nodesContainer.innerHTML = "";
        if (this.currentLevel === "overworld") {
          this.renderOverworldNodes();
        } else if (this.currentLevel === "system") {
          this.renderSystemSubsystemNodes(this.activeSystemId);
        }
        this.updateConnectorsOnly();
        this.updateBreadcrumbs();
      }

      renderOverworldNodes() {
        const systems = this.manifest.root.systems;

        systems.forEach((sys) => {
          const node = document.createElement("div");
          node.className = "system-node";
          node.dataset.id = sys.id;
          node.dataset.type = "system";
          node.style.left = `${sys.position.x}px`;
          node.style.top = `${sys.position.y}px`;

          const iconMap = {
            layout: "&#x25A6;",
            server: "&#x25A4;",
            database: "&#x229E;"
          };
          const iconChar = iconMap[sys.icon] || "&#x25CB;";

          let metricsHtml = "";
          if (sys.metrics) {
            metricsHtml = Object.entries(sys.metrics).map(([k, v]) => `
              <div class="metric-row">
                <span>${k}</span>
                <span class="metric-val">${v}</span>
              </div>
            `).join("");
          }

          node.innerHTML = `
            <div class="drag-handle" title="Drag component to reposition"></div>
            <div class="node-header">
              <div class="node-icon-box">${iconChar}</div>
              <div class="node-title-group">
                <h3>${sys.name}</h3>
                <div class="node-subtitle">${sys.badge}</div>
              </div>
            </div>
            <div class="node-body">${sys.summary}</div>
            <div class="node-metrics">
              ${metricsHtml}
            </div>
            <div class="drilldown-btn" data-action="drill">
              <span>Drill into subsystem</span> &rarr;
            </div>
          `;

          // Click handling: inspect if wasn't dragged
          node.addEventListener("click", (e) => {
            if (this.hasMovedSignificantly) return;
            const drillBtn = e.target.closest('[data-action="drill"]');
            if (drillBtn) {
              this.drillIntoSystem(sys.id);
            } else {
              this.inspectSystem(sys);
            }
          });

          this.nodesContainer.appendChild(node);
        });
      }

      renderSystemSubsystemNodes(sysId) {
        const sys = this.manifest.root.systems.find(s => s.id === sysId);
        if (!sys || !sys.internal) return;

        const nodes = sys.internal.nodes || [];

        nodes.forEach((n) => {
          const card = document.createElement("div");
          card.className = "subsystem-node";
          card.dataset.id = n.id;
          card.dataset.type = "subsystem";
          card.style.left = `${n.position.x}px`;
          card.style.top = `${n.position.y}px`;

          card.innerHTML = `
            <div class="drag-handle" title="Drag component to reposition"></div>
            <div class="subsystem-badge">${n.badge}</div>
            <div class="subsystem-title">${n.name}</div>
            <div class="subsystem-desc" style="margin-top: 8px;">${n.summary}</div>
            ${n.details?.sourceLocation ? `
              <div style="margin-top: 10px;">
                <span class="code-pill">${n.details.sourceLocation}</span>
              </div>
            ` : ""}
          `;

          card.addEventListener("click", () => {
            if (this.hasMovedSignificantly) return;
            this.inspectSubsystemNode(n, sys.name);
          });

          this.nodesContainer.appendChild(card);
        });
      }

      updateConnectorsOnly() {
        this.svg.innerHTML = "";
        this.badgesContainer.innerHTML = "";

        if (this.currentLevel === "overworld") {
          const systems = this.manifest.root.systems;
          const connectors = this.manifest.root.connectors;

          connectors.forEach((conn) => {
            const fromNode = systems.find(s => s.id === conn.from);
            const toNode = systems.find(s => s.id === conn.to);
            if (!fromNode || !toNode) return;

            // Connect boundary edges based on relative position
            const fromCenter = { x: fromNode.position.x + 135, y: fromNode.position.y + 110 };
            const toCenter = { x: toNode.position.x + 135, y: toNode.position.y + 110 };

            let x1 = fromNode.position.x + 270;
            let y1 = fromCenter.y;
            let x2 = toNode.position.x;
            let y2 = toCenter.y;

            if (fromCenter.x > toCenter.x) {
              x1 = fromNode.position.x;
              x2 = toNode.position.x + 270;
            }

            const dx = Math.abs(x2 - x1) * 0.5;
            const pathD = `M ${x1} ${y1} C ${x1 + (x2 > x1 ? dx : -dx)} ${y1}, ${x2 - (x2 > x1 ? dx : -dx)} ${y2}, ${x2} ${y2}`;

            // Hitbox
            const hitbox = document.createElementNS("http://www.w3.org/2000/svg", "path");
            hitbox.setAttribute("d", pathD);
            hitbox.setAttribute("class", "connector-hitbox");
            hitbox.addEventListener("click", () => this.inspectConnector(conn));
            this.svg.appendChild(hitbox);

            // Path line
            const base = document.createElementNS("http://www.w3.org/2000/svg", "path");
            base.setAttribute("d", pathD);
            base.setAttribute("class", "connector-path");
            base.setAttribute("id", `path-${conn.id}`);
            this.svg.appendChild(base);

            // Animated flow line
            const flow = document.createElementNS("http://www.w3.org/2000/svg", "path");
            flow.setAttribute("d", pathD);
            flow.setAttribute("class", "connector-flow");
            this.svg.appendChild(flow);

            // Midpoint badge
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;

            const badge = document.createElement("div");
            badge.className = "connector-badge";
            badge.style.left = `${midX}px`;
            badge.style.top = `${midY}px`;
            badge.innerHTML = `
              <div class="protocol-dot"></div>
              <span>${conn.protocol}</span>
            `;
            badge.addEventListener("click", () => this.inspectConnector(conn));
            this.badgesContainer.appendChild(badge);
          });
        } else if (this.currentLevel === "system") {
          const sys = this.manifest.root.systems.find(s => s.id === this.activeSystemId);
          if (!sys || !sys.internal) return;

          const nodes = sys.internal.nodes || [];
          const links = sys.internal.links || [];

          links.forEach((l) => {
            const fromNode = nodes.find(n => n.id === l.from);
            const toNode = nodes.find(n => n.id === l.to);
            if (!fromNode || !toNode) return;

            const x1 = fromNode.position.x + (fromNode.position.x < toNode.position.x ? 230 : 0);
            const y1 = fromNode.position.y + 50;
            const x2 = toNode.position.x + (fromNode.position.x < toNode.position.x ? 0 : 230);
            const y2 = toNode.position.y + 50;

            const dx = Math.abs(x2 - x1) * 0.5;
            const pathD = `M ${x1} ${y1} C ${x1 + (x2 > x1 ? dx : -dx)} ${y1}, ${x2 - (x2 > x1 ? dx : -dx)} ${y2}, ${x2} ${y2}`;

            const base = document.createElementNS("http://www.w3.org/2000/svg", "path");
            base.setAttribute("d", pathD);
            base.setAttribute("class", "connector-path");
            this.svg.appendChild(base);

            const flow = document.createElementNS("http://www.w3.org/2000/svg", "path");
            flow.setAttribute("d", pathD);
            flow.setAttribute("class", "connector-flow");
            flow.style.stroke = "var(--accent-purple)";
            this.svg.appendChild(flow);

            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;

            const badge = document.createElement("div");
            badge.className = "connector-badge";
            badge.style.left = `${midX}px`;
            badge.style.top = `${midY}px`;
            badge.style.borderColor = "rgba(192, 132, 252, 0.4)";
            badge.innerHTML = `<span style="color:#d8b4fe; font-size:11px;">${l.label}</span>`;
            this.badgesContainer.appendChild(badge);
          });
        }
      }

      drillIntoSystem(sysId) {
        this.currentLevel = "system";
        this.activeSystemId = sysId;
        this.render();
        this.centerSubsystems();
        const sys = this.manifest.root.systems.find(s => s.id === sysId);
        this.inspectSystem(sys);
      }

      navToOverworld() {
        this.currentLevel = "overworld";
        this.activeSystemId = null;
        this.render();
        this.centerOverview();
        this.closeInspector();
      }

      updateBreadcrumbs() {
        if (this.currentLevel === "overworld") {
          this.breadcrumbs.innerHTML = `
            <button class="crumb-btn active" onclick="app.navToOverworld()">Global Overworld</button>
          `;
        } else if (this.currentLevel === "system") {
          const sys = this.manifest.root.systems.find(s => s.id === this.activeSystemId);
          this.breadcrumbs.innerHTML = `
            <button class="crumb-btn" onclick="app.navToOverworld()">Global Overworld</button>
            <span class="crumb-separator">/</span>
            <button class="crumb-btn active">${sys ? sys.name : "Subsystem"}</button>
          `;
        }
      }

      inspectConnector(conn) {
        const fromNode = this.manifest.root.systems.find(s => s.id === conn.from);
        const toNode = this.manifest.root.systems.find(s => s.id === conn.to);

        document.getElementById("inspector-badge").innerText = "Pipe / Connector";
        document.getElementById("inspector-badge").style.borderColor = "var(--accent)";
        document.getElementById("inspector-badge").style.color = "var(--accent)";
        document.getElementById("inspector-title").innerText = conn.name;

        let endpointsList = "";
        if (conn.endpoints) {
          endpointsList = conn.endpoints.map(ep => `
            <div class="endpoint-card">
              <span class="endpoint-method method-${ep.method}">${ep.method}</span>
              <span class="endpoint-path">${ep.path}</span>
              <div class="endpoint-desc">${ep.desc}</div>
              <div class="endpoint-contract">${ep.contract}</div>
            </div>
          `).join("");
        }

        let specsRows = "";
        if (conn.specs) {
          specsRows = Object.entries(conn.specs).map(([k, v]) => `
            <div class="info-label">${k}</div>
            <div class="info-val">${v}</div>
          `).join("");
        }

        const html = `
          <div style="font-size: 13px; color: #94a3b8; margin-bottom: 18px;">
            ${conn.summary}
          </div>

          <div class="section-title">Connection Topology</div>
          <div class="info-grid" style="margin-bottom: 20px;">
            <div class="info-label">Source</div>
            <div class="info-val" style="color:#fff; font-weight:600;">${fromNode?.name || conn.from}</div>
            <div class="info-label">Target</div>
            <div class="info-val" style="color:#fff; font-weight:600;">${toNode?.name || conn.to}</div>
            <div class="info-label">Protocol</div>
            <div class="info-val">${conn.protocol}</div>
            <div class="info-label">Port</div>
            <div class="info-val"><span class="code-pill">${conn.port}</span></div>
            <div class="info-label">Auth Guard</div>
            <div class="info-val">${conn.auth}</div>
            ${specsRows}
          </div>

          <div class="section-title">Exposed Contracts & Routes (${conn.endpoints ? conn.endpoints.length : 0})</div>
          ${endpointsList}
        `;

        document.getElementById("inspector-content").innerHTML = html;
        this.inspector.classList.add("open");
      }

      inspectSystem(sys) {
        document.getElementById("inspector-badge").innerText = sys.badge;
        document.getElementById("inspector-badge").style.borderColor = "var(--accent)";
        document.getElementById("inspector-badge").style.color = "var(--accent)";
        document.getElementById("inspector-title").innerText = sys.name;

        let metricsRows = "";
        if (sys.metrics) {
          metricsRows = Object.entries(sys.metrics).map(([k, v]) => `
            <div class="info-label">${k}</div>
            <div class="info-val"><span class="code-pill">${v}</span></div>
          `).join("");
        }

        const html = `
          <div style="font-size: 13px; color: #94a3b8; margin-bottom: 18px;">
            ${sys.summary}
          </div>

          <div class="section-title">Realm Specifications</div>
          <div class="info-grid">
            <div class="info-label">System ID</div>
            <div class="info-val"><span class="code-pill">${sys.id}</span></div>
            <div class="info-label">Component Type</div>
            <div class="info-val">${sys.type}</div>
            ${metricsRows}
          </div>

          <div class="section-title">Subsystem Description</div>
          <div style="color: #cbd5e1; font-size: 12.5px;">
            ${sys.internal?.description || "No further details available."}
          </div>
        `;

        document.getElementById("inspector-content").innerHTML = html;
        this.inspector.classList.add("open");
      }

      inspectSubsystemNode(node, parentName) {
        document.getElementById("inspector-badge").innerText = `${parentName} Subsystem`;
        document.getElementById("inspector-badge").style.borderColor = "var(--accent-purple)";
        document.getElementById("inspector-badge").style.color = "var(--accent-purple)";
        document.getElementById("inspector-title").innerText = node.name;

        let detailsList = "";
        if (node.details) {
          detailsList = Object.entries(node.details).map(([k, v]) => `
            <div class="info-label">${k}</div>
            <div class="info-val">${k === 'sourceLocation' ? `<span class="code-pill">${v}</span>` : v}</div>
          `).join("");
        }

        const html = `
          <div style="font-size: 13px; color: #94a3b8; margin-bottom: 18px;">
            ${node.summary}
          </div>

          <div class="section-title">Contract & Invariants</div>
          <div class="info-grid">
            <div class="info-label">ID</div>
            <div class="info-val"><span class="code-pill">${node.id}</span></div>
            <div class="info-label">Archetype</div>
            <div class="info-val">${node.type}</div>
            ${detailsList}
          </div>
        `;

        document.getElementById("inspector-content").innerHTML = html;
        this.inspector.classList.add("open");
      }

      closeInspector() {
        this.inspector.classList.remove("open");
      }
    }

    const app = new ArchMapApp();
    window.addEventListener("DOMContentLoaded", () => app.load());
  </script>
</body>
</html>
